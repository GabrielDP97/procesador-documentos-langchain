name: Comprobar aplicación
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Instalar OCR local en español e inglés
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
      - name: Instalar dependencias del proyecto
        run: python -m pip install -r requirements-lock.txt
      - name: Verificar dependencias
        run: python -m pip check
      - name: Comprobar OCR sin omitir la integración real
        run: python -c "from ocr import tesseract_command; print(tesseract_command())"
      - name: Ejecutar pruebas de procesamiento, OCR y servidor
        run: python -m unittest discover -s tests -v
      - name: Comprobar JavaScript de la interfaz
        run: node --check web/app.js
